name: Allo Font Lab CI (no deployment)
on:
  pull_request:
    branches: [main]
    paths:
      - 'package.json'
      - 'src/**'
      - '.github/workflows/allo-fontlab-check.yml'
      - 'scripts/allo-font-lab-smoke.mjs'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install project dependencies
        run: npm install --no-audit --no-fund
      - name: Build with Vite
        run: npm run build
      - name: Check bundled Allo WOFF2 assets
        run: |
          find dist -type f -iname '*.woff2' -print
          test -n "$(find dist -type f -iname '*.woff2' -print -quit)"
      - name: Install CI browser test tooling
        run: |
          npm install --no-save --no-package-lock --no-audit --no-fund playwright@1.56.1
          npx playwright install --with-deps chromium
      - name: Run preview server
        run: |
          (npm run preview -- --host 127.0.0.1 --port 4173 > /tmp/allo-preview.log 2>&1 &)
          for attempt in $(seq 1 40); do
            if curl --fail --silent http://127.0.0.1:4173/ >/dev/null; then exit 0; fi
            sleep 1
          done
          cat /tmp/allo-preview.log
          exit 1
      - name: Browser smoke test and PNG download
        run: node scripts/allo-font-lab-smoke.mjs
      - name: Upload smoke results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allo-fontlab-smoke
          path: artifacts/
          if-no-files-found: ignore
